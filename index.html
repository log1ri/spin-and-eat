<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6A1FD1" />
    <meta name="description" content="กินอะไรดี? วางเข็มบนแผ่นเสียง แล้วให้แผ่นสุ่มเมนูอาหารไทยให้ เลือกแผ่นได้ทั้งข้าว เส้น ต้ม/แกง อีสาน/ยำ และของหวาน" />
    <meta name="color-scheme" content="light" />
    <!-- iOS: stop Safari from turning numbers (e.g. track time 3:42) into phone links -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Added to the iPhone home screen → launch full screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spin &amp; Eat" />
    <meta name="application-name" content="Spin &amp; Eat" />
    <!-- Link preview when shared on LINE / Facebook / Messenger
         TODO: after deploying, add og:url and og:image (must be absolute https://… URLs) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spin &amp; Eat" />
    <meta property="og:title" content="Spin &amp; Eat — สุ่มเมนู" />
    <meta property="og:description" content="กินอะไรดี? วางเข็มบนแผ่นเสียง แล้วให้แผ่นสุ่มเมนูอาหารไทยให้" />
    <meta property="og:locale" content="th_TH" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Spin &amp; Eat — สุ่มเมนู" />
    <meta name="twitter:description" content="กินอะไรดี? วางเข็มบนแผ่นเสียง แล้วให้แผ่นสุ่มเมนูอาหารไทยให้" />
    <style>
      html,
      body {
        background: var(--boot, #6a1fd1);
      }
    </style>
    <!-- Before the app loads: paint the background for the last opened album (colors match stage.bg in src/data/albums.ts) -->
    <script>
      try {
        var cat = JSON.parse(localStorage.getItem('spin-eat-ui-v1') || '{}').state.cat
        var bg = { all: '#6A1FD1', rice: '#22B357', noodle: '#FFC21A', soup: '#FF3DA8', isan: '#FF4D1F', sweet: '#3D5AFE' }[cat]
        if (bg) {
          document.documentElement.style.setProperty('--boot', bg)
          document.querySelector('meta[name=theme-color]').setAttribute('content', bg)
        }
      } catch (e) {}
    </script>
    <!-- ?v=2 forces browsers (especially Safari, which caches icons for a long time) to fetch the new icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <title>Spin &amp; Eat — สุ่มเมนู</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
